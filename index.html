<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wardrobe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<title>Wardrobe</title>
<style>
:root{
  --bg:#f7f4ee; --surface:#ffffff; --surface-2:#eee9df; --text:#1f1d1a; --muted:#6b665e;
  --border:#e3ddd1; --accent:#1f1d1a; --accent-soft:#ece5d6; --accent-text:#f7f4ee; --gold:#86672d; --danger:#a3352b; --ok:#2f6b3a;
  --shadow:0 1px 2px rgba(30,25,15,.04),0 8px 26px rgba(30,25,15,.06); --tabh:58px;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --surface:#1e1c1a; --surface-2:#2a2724; --text:#e8e2d6; --muted:#9b9488;
    --border:#3a3631; --accent:#c9a96e; --accent-soft:#2b251b; --accent-text:#121110; --gold:#c9a96e; --danger:#e3806f; --ok:#8ac796; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1e1c1a; --surface-2:#2a2724; --text:#e8e2d6; --muted:#9b9488;
  --border:#3a3631; --accent:#c9a96e; --accent-soft:#2b251b; --accent-text:#121110; --gold:#c9a96e; --danger:#e3806f; --ok:#8ac796; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "DM Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px)}
body.locked{overflow:hidden}
.top{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);padding-top:env(safe-area-inset-top)}
.top .in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 8px 4px 2px;border-radius:999px;font:inherit;color:var(--text);cursor:pointer;min-height:44px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:650;overflow:hidden;flex:0 0 auto;font-size:15px}
.avatar img{width:100%;height:100%;object-fit:cover}
.who .nm{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.01em}
.who svg{width:16px;height:16px;color:var(--muted)}
.grow{flex:1}
.aiflag{font-size:12px;color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:999px;border:0;font-family:inherit;cursor:pointer}
.aiflag.on{color:var(--accent);background:var(--accent-soft)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
main{padding-top:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:620px;margin:0 auto;display:flex}
.tabbar button{flex:1;background:none;border:0;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11px;font-weight:550;color:var(--muted);cursor:pointer;padding:0}
.tabbar svg{width:25px;height:25px}
.tabbar button.on{color:var(--accent)}
.tabbar .plus{width:40px;height:30px;border-radius:15px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center}
.tabbar .plus svg{width:20px;height:20px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2.page{font-family:var(--serif);font-size:34px;letter-spacing:.005em;margin:6px 0 12px;font-weight:500;line-height:1.1}
.pagehead{display:flex;align-items:center;gap:10px}
.pagehead h2{margin-right:auto}
button,.btn{font:inherit;font-size:15px;cursor:pointer;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger,.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
button.small,.btn.small{padding:6px 11px;font-size:14px;min-height:36px;border-radius:10px}
button.link{border:0;background:none;color:var(--accent);padding:6px 4px;min-height:0;font-weight:550}
button.wide,.btn.wide{width:100%}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--accent);flex:0 0 auto}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:0;border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:550}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.panel p{margin:0 0 10px}
.muted{color:var(--muted)} .sm{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row .right{margin-left:auto}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form2 .full{grid-column:1/-1}
/* ask / fix box */
.ask{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 12px 12px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.ask .t{font-weight:650;font-size:15px;margin-bottom:6px}
.askrow{display:flex;gap:8px;align-items:flex-end}
.askrow textarea{border-radius:14px;min-height:46px;max-height:140px;resize:none;background:var(--bg)}
.send{width:46px;height:46px;min-height:46px;border-radius:50%;padding:0;background:var(--accent);border-color:var(--accent);color:var(--accent-text);flex:0 0 auto}
.send svg{width:22px;height:22px}
.preview .cand{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:14px;margin:8px 0 0;background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
.preview .cand img{width:48px;height:60px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.preview .cand .body{flex:1;min-width:0}
.preview .diff{font-size:13px;margin-top:3px}
.fixmsg{font-size:14px;margin-top:10px}
del{color:var(--danger)} ins{color:var(--ok);text-decoration:none;font-weight:600}
.msg{font-size:14px;margin-top:8px}
.msg:empty{display:none}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
/* closet */
.toolrow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.toolrow .search{flex:1}
.search{position:relative}
.search input{background:var(--surface);border-color:var(--border)}
.fixbtn{background:none;border-color:var(--border);border-radius:999px;font-weight:500;padding:10px 14px}
.iconbtn{width:44px;padding:0;border-radius:50%;flex:0 0 auto}
.fixbtn svg{width:18px;height:18px}
.list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;border-radius:0;border-top:1px solid var(--border);color:var(--text);text-align:left;justify-content:flex-start;margin:0;font-size:16px;font-weight:400;cursor:pointer;min-height:52px}
.lrow:first-child{border-top:0}
.lrow .lic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.lrow .lic svg{width:19px;height:19px}
.lrow .lt{flex:1}
.lrow .ls{color:var(--muted);font-size:14px}
.lrow .chev{width:16px;height:16px;color:var(--muted)}
.addface{display:grid;place-items:center;aspect-ratio:1;font-size:30px;color:var(--muted);cursor:pointer;margin:0;border:1.5px dashed var(--border);background:none}
.aiflag.warn{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.avatar{position:relative}
.avatar.syncing::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:sp 1s linear infinite}
.search input{padding-left:38px;border-radius:999px}
.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;padding:7px 15px;font-size:14px;min-height:36px;background:none;border:1px solid var(--border);color:var(--muted);white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.chip .n{display:none}
.cat h3{font-family:var(--serif);font-size:26px;margin:24px 0 12px;display:flex;align-items:baseline;gap:10px;font-weight:500}
.cat h3 span{font-family:"DM Sans",sans-serif;color:var(--muted);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));min-width:0;gap:18px 12px}
.card{min-width:0;background:none;border:0;border-radius:0;overflow:visible;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:0;color:var(--text)}
.thumb{aspect-ratio:4/5;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden;border-radius:14px}
.card:active .thumb{opacity:.85}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .meta{padding:9px 2px 4px}
.card .nm{font-weight:400;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{color:var(--gold);font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.steps li:first-child{border-top:0}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.steps li.done .n{background:var(--accent);color:var(--accent-text)}
.steps .tx{flex:1;font-size:15px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner .x{margin-left:auto;min-height:0;padding:2px 8px;border:0;background:none;color:var(--muted)}
/* home */
.logo{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
body.home .top{display:none}
body.home main{padding-top:0}
body.home{background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--gold) 8%,transparent) 0 1px,transparent 1px 14px)}
#tab-home{min-height:calc(100vh - var(--tabh) - 12px);min-height:calc(100dvh - var(--tabh) - 12px - env(safe-area-inset-bottom));display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) 12px 12px}
#tab-home[hidden]{display:none}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;min-height:0;padding:4px;margin:0 auto;color:var(--gold)}
.brand .logo{width:56px;height:56px}
.brand span{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.menu{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.menu .in{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:4px 0;background:color-mix(in srgb,var(--bg) 92%,transparent)}
.mi{display:flex;align-items:baseline;gap:16px;width:100%;padding:18px 4px;border:0;border-bottom:1px solid var(--border);border-radius:0;background:none;color:var(--text);text-align:left;justify-content:flex-start;min-height:0;font-family:var(--serif);font-size:46px;font-weight:500;line-height:1}
.mi:last-child{border-bottom:0}
.mi i{font-size:17px;color:var(--gold);width:24px;flex:0 0 auto}
.mi .t{flex:1}
.mi .n{font-family:"DM Sans",sans-serif;font-size:13px;color:var(--muted)}
.mi.gold{color:var(--gold)}
.mi:active{opacity:.6}
.homefoot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:color-mix(in srgb,var(--bg) 92%,transparent)}
.nexttrip{background:none;border:0;padding:0;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;color:var(--text)}
.nexttrip .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.nexttrip .v{font-family:var(--serif);font-size:22px}
.nexttrip .s{font-size:13px;color:var(--muted)}
.dots{width:44px;height:44px;min-height:44px;padding:0;border:0;background:none;color:var(--muted);margin-left:auto}
.dots svg{width:20px;height:20px}
#homeStart:empty{display:none}
#homeStart{margin-top:8px}
/* sheets */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding-top:max(env(safe-area-inset-top),20px)}
.modal.open{display:flex}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;max-width:760px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet.wide{max-width:1120px}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:flex-start;gap:10px;padding:14px 0 10px;margin-bottom:4px}
.shead h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
.shead .sub{font-size:13px;color:var(--muted)}
.shead .x{margin-left:auto;width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;background:var(--surface-2);border:0;color:var(--muted);font-size:18px;flex:0 0 auto}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--border);margin:8px auto 0}
@media (min-width:760px){
  .modal{align-items:flex-start;padding:28px 16px;overflow:auto}
  .sheet{border-radius:20px;max-height:none;overflow:visible;padding-bottom:22px}
  .grabber{display:none}
}
.photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scroll-snap-type:x mandatory}
.photos .ph{position:relative;flex:0 0 auto;scroll-snap-align:start}
.photos img{height:260px;border-radius:14px;display:block}
.photos .ph button{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:0;width:32px;height:32px;min-height:32px;border-radius:50%;padding:0}
.hist{font-size:13px;margin:0;padding:0;list-style:none}
.hist li{padding:8px 0;border-top:1px solid var(--border);display:flex;gap:8px;align-items:baseline}
.hist .when{color:var(--muted);white-space:nowrap}
.hist .what{flex:1}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
.toast{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;z-index:30;display:none;max-width:90vw;box-shadow:var(--shadow)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* faces */
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.face{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.face img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.face button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:0;width:28px;height:28px;min-height:28px;border-radius:50%;padding:0;font-size:13px}
/* wardrobes list */
.plist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:14px;background:var(--bg);cursor:pointer;text-align:left;width:100%;justify-content:flex-start;color:var(--text)}
.prow.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prow .nm{font-weight:600}
.prow .tick{margin-left:auto;color:var(--accent);font-weight:700}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{flex-direction:column;font-size:14px;padding:12px 8px;border-radius:14px}
.choice.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.welcome .wicon{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;margin:18px 0 10px}
.welcome .wicon svg{width:36px;height:36px}
.welcome h2{font-family:var(--serif);font-size:32px;font-weight:500;margin:0 0 6px}
/* add from photos */
.addhero{text-align:center;padding:26px 16px}
.addhero .big{font-size:17px;padding:14px 22px;border-radius:16px;min-height:54px}
.toggle{display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;color:var(--text);font-weight:400;margin:14px 0 0}
.draft{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px}
.draft .pics{display:flex;gap:6px;overflow-x:auto;margin-bottom:4px}
.draft .pics img{height:110px;border-radius:10px}
.draft .form2 label{margin-top:8px}
/* outfits */
.grouph{font-size:18px;margin:18px 0 10px;letter-spacing:-.01em}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;color:var(--text)}
.ocard .hero{aspect-ratio:3/2;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px;width:100%}
.ocard .hero img{width:100%;height:100%;object-fit:cover}
.ocard .strip{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap}
.ocard .strip img{width:34px;height:42px;object-fit:cover;border-radius:5px}
.ocard .meta{padding:8px 12px 12px}
.ocard .nm{font-weight:600}
.olayout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(220px,1fr);gap:16px}
.render{background:var(--surface-2);border-radius:16px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);text-align:center}
.render img{width:100%;height:100%;object-fit:contain;background:#000}
.render .ph{padding:20px;font-size:14px}
.olabels{display:flex;justify-content:space-around;font-size:12px;color:var(--muted);margin-top:4px}
.prev{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.prev img{height:64px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.prev img.on{border-color:var(--accent)}
.pieces h3{font-size:15px;margin:0 0 8px}
.piece{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);cursor:pointer}
.piece img{width:60px;height:75px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.piece .nm{font-size:14px;font-weight:600}
.piece .sub{font-size:12px;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;max-height:46vh;overflow:auto;margin-top:8px;padding:2px}
.pick{position:relative;border:2px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface);font-size:11px;padding:0;text-align:left;color:var(--text);display:block;min-height:0}

.gaps{margin:6px 0 0;padding-left:18px;font-size:14px}
.tcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;justify-content:flex-start;padding:12px;border-radius:16px;margin-bottom:10px;color:var(--text)}
.tcard .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}

.tcard .trip-photo img{width:100%;height:100%;object-fit:cover}
.tcard .ico svg{width:24px;height:24px}
.tcard .nm{font-weight:650}
@media (max-width:760px){.olayout{grid-template-columns:1fr}}
@media (max-width:560px){
  .form2{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .olist{grid-template-columns:1fr}
  .photos img{height:220px}
  h2.page{font-size:31px}
}

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date().toISOString();
const fmtDate=s=>new Date(s).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2800)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ICON={
  logo:`<svg viewBox="0 0 64 64" class="logo" style="width:40px;height:40px" aria-hidden="true"><path d="M27.3 15.2 A5.2 5.2 0 1 1 32 18.2 V22.5"/><path d="M32 22.5 L11.5 36.2 C9.6 37.5 10.4 40 12.6 40 H51.4 C53.6 40 54.4 37.5 52.5 36.2 Z"/></svg>`,
  trip:`<svg viewBox="0 0 24 24" class="ic"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.2c0-.7.5-1.2 1.2-1.2h3.6c.7 0 1.2.5 1.2 1.2V7M3 12.5h18"/></svg>`,
  hanger:`<svg viewBox="0 0 64 64" class="ic" style="stroke-width:4.2"><path d="M27.3 15.2 A5.2 5.2 0 1 1 32 18.2 V22.5"/><path d="M32 22.5 L11.5 36.2 C9.6 37.5 10.4 40 12.6 40 H51.4 C53.6 40 54.4 37.5 52.5 36.2 Z"/></svg>`
};

/* ================= categories ================= */
const TEMPLATES={
  mens:{label:"Men's",person:"man",cats:[["Blazers","BL"],["Outerwear","OW"],["Pants:Shorts","PS"],["Polos","PO"],["Shirts","SH"],["Shoes","SO"],["Suits","SU"],["Sweaters","SW"],["Tshirts","TS"],["Misc","MI"]]},
  womens:{label:"Women's",person:"woman",cats:[["Tops","TP"],["Blouses & Shirts","BS"],["Sweaters","SW"],["Dresses","DR"],["Skirts","SK"],["Pants & Shorts","PS"],["Jackets & Blazers","JK"],["Outerwear","OW"],["Activewear","AC"],["Shoes","SO"],["Bags","BG"],["Accessories","AX"]]},
  all:{label:"Mixed",person:"person",cats:[["Tops","TP"],["Shirts","SH"],["Sweaters","SW"],["Dresses","DR"],["Skirts","SK"],["Pants & Shorts","PS"],["Suits","SU"],["Jackets & Blazers","JK"],["Outerwear","OW"],["Activewear","AC"],["Shoes","SO"],["Bags","BG"],["Accessories","AX"]]}
};
// words that point to a category, most specific first
const CAT_WORDS=[
  ["Tshirts",["t-shirt","tshirt","tee","t shirt"]],
  ["Polos",["polo","henley"]],
  ["Dresses",["dress","gown","jumpsuit","romper"]],
  ["Skirts",["skirt"]],
  ["Suits",["suit","tuxedo"]],
  ["Activewear",["ski","legging","sports bra","athletic","gym","base layer","activewear","swimsuit","bikini","swim trunk"]],
  ["Bags",["bag","purse","tote","clutch","backpack","handbag","crossbody"]],
  ["Accessories",["scarf","scarves","glove","mitten","belt","hat","beanie","cap","necktie","tie","jewelry","jewellery","necklace","earring","bracelet","sunglasses","pocket square","accessor"]],
  ["Blazers",["blazer","sport coat","sportcoat","sports coat"]],
  ["Sweaters",["sweater","knit","cardigan","pullover","jumper","quarter-zip","quarter zip","hoodie","sweatshirt","fleece"]],
  ["Shoes",["shoe","loafer","boot","sneaker","trainer","oxford","derby","brogue","sandal","moccasin","heels","pump","mule","espadrille","slipper"]],
  ["Pants:Shorts",["pant","trouser","short","jean","chino","slacks"]],
  ["Outerwear",["coat","overcoat","parka","raincoat","trench","peacoat","outerwear","vest","gilet","anorak","puffer"]],
  ["Blazers",["jacket"]],
  ["Blouses & Shirts",["blouse"]],
  ["Shirts",["shirt","button-down"]],
  ["Tops",["top","tank","cami","bodysuit"]]
];
const CAT_ALIAS={Tshirts:["Tops","Shirts"],Polos:["Tops","Shirts"],Blazers:["Jackets & Blazers","Suits","Outerwear"],Suits:["Jackets & Blazers","Blazers"],
  "Pants:Shorts":["Pants & Shorts"],"Pants & Shorts":["Pants:Shorts"],"Blouses & Shirts":["Shirts","Tops"],Shirts:["Blouses & Shirts","Tops"],Tops:["Tshirts","Blouses & Shirts","Shirts"],
  Accessories:["Misc"],Misc:["Accessories"],Bags:["Accessories","Misc"],Activewear:["Misc","Accessories"],Skirts:["Pants & Shorts"],Outerwear:["Jackets & Blazers"],"Jackets & Blazers":["Blazers","Outerwear"]};
const SINGULAR={Blazers:"Jacket",Outerwear:"Coat",Suits:"Suit",Sweaters:"Sweater",Shirts:"Shirt",Polos:"Polo",Tshirts:"T-shirt","Pants:Shorts":"Trousers","Pants & Shorts":"Trousers",Shoes:"Shoes",Misc:"Accessory",Tops:"Top","Blouses & Shirts":"Blouse",Dresses:"Dress",Skirts:"Skirt","Jackets & Blazers":"Jacket",Activewear:"Activewear",Bags:"Bag",Accessories:"Accessory"};
const catLabel=c=>c==="Pants:Shorts"?"Pants & Shorts":c==="Tshirts"?"T-shirts":c;
function catNames(){const base=(profile&&profile.cats||[]).map(c=>c.name);for(const it of items) if(it.category&&!base.includes(it.category)) base.push(it.category);return base}
function makePrefix(name){
  const used=new Set((profile&&profile.cats||[]).map(c=>c.prefix)); const L=name.toUpperCase().replace(/[^A-Z]/g,"");
  const w=name.toUpperCase().replace(/[^A-Z ]/g," ").trim().split(/\s+/);
  const tries=[w.length>1?w[0][0]+w[1][0]:"",L.slice(0,2),...[...L.slice(1)].map(c=>L[0]+c)].filter(x=>x.length===2);
  for(const t of tries) if(!used.has(t)) return t;
  let i=1; while(used.has("X"+i)) i++; return "X"+i;
}
function prefixOf(cat){const c=(profile&&profile.cats||[]).find(x=>x.name===cat);return c?c.prefix:makePrefix(cat)}
function resolveCat(c){const cs=catNames();if(cs.includes(c))return c;for(const a of CAT_ALIAS[c]||[]) if(cs.includes(a)) return a;return null}
function guessCategory(text){
  const t=" "+String(text||"").toLowerCase()+" ", cs=catNames(), tt=t.trim();
  const ex=cs.find(c=>c.toLowerCase()===tt||catLabel(c).toLowerCase()===tt); if(ex) return ex;
  for(const [c,words] of CAT_WORDS) for(const w of words) if(new RegExp("\\b"+w.replace(/[-\s]/g,"[-\\s]?")).test(t)){const r=resolveCat(c);if(r)return r}
  return null;
}
function layerRank(cat){const c=String(cat).toLowerCase();return /outer|coat/.test(c)?0:/suit/.test(c)?1:/blazer|jacket/.test(c)?2:/sweater|knit/.test(c)?3:/dress/.test(c)?4:/shirt|blouse|polo|top|tee/.test(c)?5:/pant|short|skirt|trouser/.test(c)?6:/shoe/.test(c)?7:8}
function layerName(it){return /pants/i.test(it.category)&&/short/i.test(it.name)?"Shorts":SINGULAR[it.category]||it.category}

/* ================= storage ================= */
let db=null, dbName=null, profile=null;
let items=[], faces=[], log=[], outfits=[], trips=[];
function openDB(name){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(name,3);
    r.onupgradeneeded=()=>{
      const d=r.result, has=n=>d.objectStoreNames.contains(n);
      if(!has("items")) d.createObjectStore("items",{keyPath:"id"});
      if(!has("faces")) d.createObjectStore("faces",{keyPath:"id"});
      if(!has("log")) d.createObjectStore("log",{keyPath:"seq",autoIncrement:true});
      if(!has("outfits")) d.createObjectStore("outfits",{keyPath:"id"});
      if(!has("meta")) d.createObjectStore("meta",{keyPath:"id"});
      if(!has("trips")) d.createObjectStore("trips",{keyPath:"id"});
    };
    r.onblocked=()=>{const n=$("#notice");if(n)n.innerHTML=`<div class="panel"><h3>Almost there</h3><p>An older copy of the wardrobe app is still open in another tab or window. Close it, and this page will open your closet by itself. Your clothes are safe.</p></div>`};
    r.onsuccess=()=>{const n=$("#notice");if(n)n.innerHTML="";const d=r.result;d.onversionchange=()=>d.close();res(d)}; r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode); const s=t.objectStore(store); let out;
    Promise.resolve(fn(s)).then(v=>out=v);
    t.oncomplete=()=>{res(out);if(mode==="readwrite")scheduleSync()}; t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error("Saving failed (storage full?)"));
  });
}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getAll=(store,d=db)=>reqP(d.transaction(store).objectStore(store).getAll());
const putItem=it=>tx("items","readwrite",s=>s.put(it));
const delItem=id=>tx("items","readwrite",s=>s.delete(id));
const addLog=e=>tx("log","readwrite",s=>s.add(e));
const putOutfit=o=>tx("outfits","readwrite",s=>s.put(o));
const putTrip=t=>tx("trips","readwrite",s=>s.put(t));
const putMeta=()=>{profile.updatedAt=now();return tx("meta","readwrite",s=>s.put(profile))};
const tomb=(kind,id)=>tx("meta","readwrite",s=>s.put({id:"del:"+kind+":"+id,kind,key:String(id),at:now()}));
async function logEntry(e){await addLog(e);log.push(e)}
async function loadAll(){items=await getAll("items");faces=await getAll("faces");log=await getAll("log");outfits=await getAll("outfits");trips=await getAll("trips")}

/* ================= wardrobes (one database each) ================= */
let profiles=[];
async function knownDBs(){
  let names=LS.get("wardrobe-dbs",[]);
  try{if(indexedDB.databases){const l=await indexedDB.databases();names=[...new Set([...names,...l.map(d=>d.name).filter(n=>n==="henry-wardrobe"||/^wardrobe-p-/.test(n))])]}}catch(e){}
  return names;
}
function rememberDB(n){const l=LS.get("wardrobe-dbs",[]);if(!l.includes(n)){l.push(n);LS.set("wardrobe-dbs",l)}}
function forgetDB(n){LS.set("wardrobe-dbs",LS.get("wardrobe-dbs",[]).filter(x=>x!==n))}
async function loadProfiles(){
  const out=[];
  for(const n of await knownDBs()){
    if(n===dbName){out.push({db:n,name:profile?profile.name:"Wardrobe",count:items.length});continue}
    try{const d=await openDB(n);const m=await reqP(d.transaction("meta").objectStore("meta").get("profile"));const c=await reqP(d.transaction("items").objectStore("items").count());d.close();
      if(!m&&!c){continue} out.push({db:n,name:m?m.name:(n==="henry-wardrobe"?"Henry":"Wardrobe"),count:c})}catch(e){}
  }
  profiles=out.sort((a,b)=>a.name.localeCompare(b.name)); return profiles;
}
function newProfile(name,style,build){
  const t=TEMPLATES[style]||TEMPLATES.all;
  return {id:"profile",name,style,person:t.person,build:build||"",cats:t.cats.map(([n,p])=>({name:n,prefix:p})),createdAt:now()};
}
async function switchTo(name){
  if(db){db.close();db=null}
  db=await openDB(name); dbName=name; LS.set("wardrobe-current",name); rememberDB(name);
  await loadAll();
  profile=await reqP(db.transaction("meta").objectStore("meta").get("profile"))||null;
  if(!profile){
    if(!(items.length||faces.length||outfits.length)) return showWelcome({reuse:true});
    // an older single-wardrobe copy: adopt it
    const legacy=LS.get("wardrobe-tryon",{});
    profile=newProfile(name==="henry-wardrobe"?"Henry":"My wardrobe","mens",legacy.build||(name==="henry-wardrobe"?"6'1\" (185 cm), 170 lb (77 kg), average-to-slender frame, natural posture. Not a model physique.":""));
    for(const it of items) if(it.category&&!profile.cats.some(c=>c.name===it.category)) profile.cats.push({name:it.category,prefix:makePrefix(it.category)});
    await putMeta();
  }
  activeCat="All"; query=""; $("#q").value="";
  renderAll(); makeThumbs(); scheduleSync(1500);
}
async function start(){
  const legacy=LS.get("wardrobe-tryon",null);
  if(legacy&&!LS.get("wardrobe-ai",null)) LS.set("wardrobe-ai",{key:legacy.key||"",imageModel:legacy.model||"gpt-image-1",quality:legacy.quality||"high"});
  const names=await knownDBs();
  if(!names.length) return showWelcome({first:true});
  let cur=LS.get("wardrobe-current",null);
  if(!names.includes(cur)) cur=names.includes("henry-wardrobe")?"henry-wardrobe":names[0];
  await switchTo(cur);
  if(session) syncNow();
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
}

/* ================= smart features (OpenAI) ================= */
const AI_DEFAULTS={key:"",gkey:"",gModel:"",textModel:"gpt-4.1-mini",imageModel:"gpt-image-1",quality:"high"};
const ai=()=>({...AI_DEFAULTS,...LS.get("wardrobe-ai",{})});
const hasAI=()=>false; // Subscription handoff only; model API calls disabled.
const hasOpenAI=()=>false; // Try-on is handed off to ChatGPT.
function friendlyAIError(status,msg){
  if(status===401) return "OpenAI didn't accept your key. Check it under More → Smart features.";
  if(status===429) return /quota|billing|credit/i.test(msg)?"Your OpenAI account is out of credit. Add some at platform.openai.com → Billing.":"OpenAI is busy right now. Wait a moment and try again.";
  return msg;
}
async function geminiModels(){ // ask Google which Flash models this key can use, newest stable first
  const s=ai();
  try{
    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000",{headers:{"x-goog-api-key":s.gkey}});
    const j=await res.json().catch(()=>({}));
    if(!res.ok){const msg=(j.error&&j.error.message)||"";if(/API key|API_KEY/i.test(msg)||res.status===403)throw new Error("Google didn't accept your Gemini key. Check it under More → Smart features.");return []}
    const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
    return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
      .filter(n=>/^gemini-.*flash/.test(n)&&!/lite|image|tts|audio|live|embed|vision|thinking/.test(n))
      .sort((a,b)=>(/preview|exp/.test(a)-/preview|exp/.test(b))||ver(b)-ver(a)||(/latest/.test(b)-/latest/.test(a)));

async function geminiChat(messages,maxTokens){ // Google's free tier; same JSON contract as aiChat

  const part=c=>c.type==="image_url"?(([,mime,data])=>({inline_data:{mime_type:mime,data}}))(c.image_url.url.match(/^data:([^;]+);base64,(.*)$/)||[]):{text:c.text};
  const contents=messages.filter(m=>m.role!=="system").map(m=>({role:m.role==="assistant"?"model":"user",parts:typeof m.content==="string"?[{text:m.content}]:m.content.map(part)}));
  let lastErr=null, list=[...new Set([s.gModel,"gemini-flash-latest"].filter(Boolean))], listed=false;
  for(let i=0;i<list.length;i++){

    if(sys) body.systemInstruction={parts:[{text:sys}]};
    if(/2\.5-flash/.test(model)) body.generationConfig.thinkingConfig={thinkingBudget:0};

    catch(e){throw new Error("Couldn't reach Google. Check your internet connection and try again.")}
    const j=await res.json().catch(()=>({}));
    if(res.ok){
      const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
      try{const v=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1)); if(model!==s.gModel) LS.set("wardrobe-ai",{...LS.get("wardrobe-ai",{}),gModel:model}); return v}
      catch(e){lastErr=new Error("Gemini's answer was cut off or unreadable. Try again.");continue}
    }
    const msg=(j.error&&j.error.message)||`Gemini error ${res.status}`;
    if(res.status===404||/no longer available|not found|not supported/i.test(msg)){
      lastErr=new Error(msg);

      continue}
    if(res.status===400&&/API key|API_KEY/i.test(msg)||res.status===403) throw new Error("Google didn't accept your Gemini key. Check it under More → Smart features.");
    if(res.status===503||res.status===500||/overloaded|high demand|unavailable/i.test(msg)){ // busy: wait a moment, then try the next Flash model
      lastErr=new Error("Google's free Gemini is busy right now. Wait a minute and try again.");

    if(res.status===429) throw new Error("You've hit Gemini's free limit for now. Wait a minute and try again.");
    throw new Error(msg);
  }

}
async function aiChat(messages,{maxTokens=4000,provider}={}){
  const s=ai(); if(s.gkey&&provider!=="openai") return geminiChat(messages,maxTokens);
  if(!s.key) throw new Error("Turn on smart features first (More → Smart features).");
  const models=[...new Set([s.textModel,"gpt-4.1-mini","gpt-5-mini","gpt-4o-mini"].filter(Boolean))];
  let lastErr=null;
  for(const model of models){
    const body={model,messages,response_format:{type:"json_object"},max_completion_tokens:maxTokens};
    if(/^gpt-5/.test(model)) body.reasoning_effort="minimal";
    let res;
    try{res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.key},body:JSON.stringify(body)})}
    catch(e){throw new Error("Couldn't reach OpenAI. Check your internet connection and try again.")}
    const j=await res.json().catch(()=>({}));
    if(res.ok){
      const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
      try{const v=JSON.parse(txt); if(model!==s.textModel) LS.set("wardrobe-ai",{...LS.get("wardrobe-ai",{}),textModel:model}); return v}
      catch(e){lastErr=new Error("OpenAI's answer was cut off or unreadable. Try again.");continue}
    }

    if(res.status===404||(res.status===400&&/model|parameter/i.test(msg))){lastErr=new Error(msg);continue}
    throw new Error(friendlyAIError(res.status,msg));
  }
  throw lastErr||new Error("OpenAI couldn't answer.");
}

function fileToDataURL(file,maxDim=1400){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,maxDim/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("This browser can't open "+file.name+(/heic|heif/i.test(file.name)?" (HEIC). Try Safari, or export it as JPEG.":"")))};
    img.src=url;
  });
}
function shrink(dataURL,maxDim,type="image/jpeg",q=.9){
  return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,maxDim/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL(type,q))};img.onerror=()=>res(dataURL);img.src=dataURL});
}

function localFix(text,fixedItem){

  if(!options.length) return {mode:"one",options,message:`I couldn't find ${p.from?`“${p.from}” on `:""}${fixedItem?"this piece":"a piece matching that"}.`+(hasAI()?"":" Include the item's ID, or use Discuss in ChatGPT / Claude for more complex changes.")};

const FIELD_ALIASES={name:"name",description:"name",desc:"name",title:"name",color:"color",colour:"color",brand:"brand",maker:"brand",material:"material",fabric:"material",size:"size",fit:"size",notes:"notes",note:"notes",category:"category"};

- "none": nothing fits, or it isn't a change to the catalog. Say so kindly in message.

let gptPack={key:"",files:null};
async function prepGptFiles(o){
  const ps=outfitPieces(o).filter(p=>p.it), key=o.id+"|"+(o.updatedAt||"")+"|"+faces.length+"|"+ps.map(p=>p.id).join();
  if(gptPack.key===key) return; gptPack={key,files:null};
  const refs=faces.slice(0,3).map((f,i)=>({u:f.data,n:`face-${i+1}.jpg`}));
  for(const p of ps) if((p.it.photos||[])[0]) refs.push({u:p.it.photos[0],n:`${p.id}.jpg`});
  for(const p of ps) if((p.it.photos||[])[1]) refs.push({u:p.it.photos[1],n:`${p.id}-2.jpg`});
  const files=[gptPDF(o)]; for(const r of refs.slice(0,9)){const b=await dataURLtoBlob(await shrink(r.u,1024));files.push(new File([b],r.n,{type:"image/jpeg"}))}
  if(gptPack.key===key) gptPack.files=files;
}
const GPT_ASK="Make the try-on picture described in the attached PDF, using the attached photos.";
function gptPDF(o){ // one small text PDF with the instructions, so nothing needs pasting
  return textPDF(`${GPT_ASK}\n\n${buildPrompt(o)}`,`Try-on instructions - ${(o.name||"outfit").replace(/[^\w ,.-]+/g,"").slice(0,40)}.pdf`);
}
function textPDF(text,filename){
  const clean=t=>t.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,"-").replace(/…/g,"...").replace(/·/g,"-").replace(/[^\x20-\x7e\n]/g,"?");
  const body=clean(text), lines=[];
  for(const para of body.split("\n")){let l="";for(const w of para.split(" ")){if((l+" "+w).trim().length>92){lines.push(l);l=w}else l=(l?l+" ":"")+w}lines.push(l)}
  const per=54, pages=[]; for(let i=0;i<lines.length;i+=per) pages.push(lines.slice(i,i+per));
  const objs=["<< /Type /Catalog /Pages 2 0 R >>","",`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`];
  const kids=[];
  for(const pg of pages){
    const stream="BT /F1 10 Tf 13 TL 50 742 Td "+pg.map(l=>`(${l.replace(/[\\()]/g,"\\$&")}) Tj T*`).join(" ")+" ET";
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents ${objs.length+2} 0 R >>`);
    kids.push(`${objs.length} 0 R`);
    objs.push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
  }
  objs[1]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${kids.length} >>`;
  let out="%PDF-1.4\n"; const off=[];
  objs.forEach((x,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${x}\nendobj\n`});
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(n=>String(n).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new File([out],filename,{type:"application/pdf"});
}
function tryOnInChatGPT(o){
  const m=$("#tryonMsg"), say=(t,c="")=>{m.className="msg "+c;m.textContent=t};
  if(!faces.length) return say("Add 2 or 3 photos of your face first (More, then Photos).","err");
  if(!outfitPieces(o).some(p=>p.it)) return say("This outfit has no pieces from your closet.","err");
  const files=gptPack.files; if(!files) return say("Getting the photos ready. Tap again in a second.");
  try{navigator.clipboard.writeText(GPT_ASK).catch(()=>{})}catch(e){}
  const data=navigator.canShare&&(navigator.canShare({files,text:GPT_ASK})?{files,text:GPT_ASK}:navigator.canShare({files})?{files}:null);
  if(data){
    navigator.share(data).then(()=>say("Sent. In ChatGPT, tap send (if the message box is empty, type “go”). When the picture is ready, press on it, save it to Photos, then come back and tap Add picture.","ok"))
      .catch(e=>{if(e.name!=="AbortError")say("Couldn't open the share sheet ("+e.message+").","err")});
    say("Pick ChatGPT in the share sheet.");
  } else {
    for(const f of files){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
    say(`Downloaded the instructions PDF and ${files.length-1} photos. Open chatgpt.com, attach them all and send. Save the picture, then tap Add picture.`,"ok");
  }
}

async function runTryOn(o){
  const s=ai(), msg=()=>$("#tryonMsg");
  if(!s.key){closeModal(true);showTab("more");openPanel("ai");toast("Try on needs your OpenAI key. Paste it here, then try again.");return}
  if(!faces.length){msg().className="msg err";msg().textContent="Add a few photos of your face in the More tab first.";return}
  const ps=outfitPieces(o).filter(p=>p.it);
  if(!ps.length){msg().className="msg err";msg().textContent="This outfit has no pieces from your closet.";return}
  const refs=[...faces.slice(0,3).map((f,i)=>({u:f.data,n:`face-${i+1}.jpg`}))];
  for(const p of ps) (p.it.photos||[]).slice(0,2).forEach((u,k)=>refs.push({u,n:`${p.id}-${k+1}.jpg`}));
  const blobs=[]; for(const r of refs.slice(0,16)) blobs.push([await dataURLtoBlob(await shrink(r.u,1024)),r.n]);
  busy=true; if(openOutfitId===o.id) renderOutfitView(); const t0=Date.now();
  const tick=setInterval(()=>{const m=msg();if(m&&openOutfitId===o.id){m.className="msg";m.textContent=`Sending ${blobs.length} photos to OpenAI… ${Math.round((Date.now()-t0)/1000)}s (usually one to two minutes)`}},1000);
  let err=null, image=null, used=s.imageModel;
  for(const model of [...new Set([s.imageModel,"gpt-image-1"])]){
    const fd=new FormData();
    fd.append("model",model); fd.append("prompt",buildPrompt(o)); fd.append("size","1536x1024");
    fd.append("quality",s.quality); fd.append("input_fidelity","high"); fd.append("n","1");
    for(const [b,n] of blobs) fd.append("image[]",b,n);
    try{
      const res=await fetch("https://api.openai.com/v1/images/edits",{method:"POST",headers:{Authorization:"Bearer "+s.key},body:fd});
      const j=await res.json().catch(()=>({})); err=null;
      if(!res.ok){const m=(j.error&&j.error.message)||`OpenAI returned an error (${res.status}).`;err=friendlyAIError(res.status,m);if((res.status===404||res.status===400)&&/model/i.test(m)&&model!=="gpt-image-1")continue}
      else if(!j.data||!j.data[0]||!j.data[0].b64_json) err="OpenAI didn't return a picture.";
      else {image=await shrink("data:image/png;base64,"+j.data[0].b64_json,1536,"image/jpeg",.92);used=model}
    }catch(e){err="Couldn't reach OpenAI ("+e.message+"). Check your internet connection and try again."}
    break;
  }
  clearInterval(tick); busy=false;
  if(image){o.renders=[{at:now(),image,model:used},...(o.renders||[])];o.updatedAt=now();await putOutfit(o);shownRender=0}
  if(openOutfitId===o.id){renderOutfitView();if(err){msg().className="msg err";msg().textContent=err}else{msg().className="msg ok";msg().textContent="Done. Compare the face and clothes with the real pieces; try again if anything drifted."}}
  else toast(err?"Try-on failed: "+err:"Try-on ready for "+o.name);
}

async function importOutfits(file){
  const m=$("#moreMsg")||$("#outfitMsg");
  try{
    const j=JSON.parse(await file.text()); const list=Array.isArray(j)?j:j.outfits;
    if(!Array.isArray(list)) throw new Error("no outfits found in that file");
    let added=0,updated=0;
    for(const [i,x] of list.entries()){
      if(!x.name||!Array.isArray(x.itemIds)) continue;
      const ex=outfits.find(o=>o.id===x.id);
      const o={...(ex||{renders:[],createdAt:now()}),...x,renders:ex?ex.renders:[],order:x.order??`${x.trip||""}-${String(i).padStart(3,"0")}`,updatedAt:now()};
      await putOutfit(o); if(ex){outfits[outfits.indexOf(ex)]=o;updated++}else{outfits.push(o);added++}
    }
    const missing=[...new Set(list.flatMap(x=>x.itemIds||[]).filter(id=>!itemById(id)))];
    m.className="msg ok"; m.textContent=`Imported ${added} outfit(s)${updated?`, updated ${updated}`:""}.`+(missing.length?` ${missing.length} piece(s) aren't in this closet yet (${missing.slice(0,6).join(", ")}${missing.length>6?"…":""}).`:"");
  }catch(e){m.className="msg err";m.textContent="Couldn't import outfits: "+e.message}
}

const PLAN_ASK="Plan my trip outfits as described in the attached PDF. Reply with only the JSON.";
function planInChatGPT(sys,user,meta){
  const m=$("#planMsg"), file=textPDF(`${PLAN_ASK}\n\n${sys}\n\n${user}\n\nReply with only the JSON object, nothing before or after it.`,"Trip plan request.pdf");
  try{localStorage.setItem("wardrobe-pendingplan",JSON.stringify(meta))}catch(e){}
  try{navigator.clipboard.writeText(PLAN_ASK).catch(()=>{})}catch(e){}
  const done=`Sent. In ChatGPT, tap send. When it answers, tap the copy button under its reply, come back here and tap Paste plan.`;
  const data=navigator.canShare&&(navigator.canShare({files:[file],text:PLAN_ASK})?{files:[file],text:PLAN_ASK}:navigator.canShare({files:[file]})?{files:[file]}:null);
  if(data) navigator.share(data).then(()=>{m.className="msg ok";m.textContent=done;showPaste()}).catch(e=>{if(e.name!=="AbortError"){m.className="msg err";m.textContent="Couldn't open the share sheet ("+e.message+")."}});
  else {const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;a.click();m.className="msg ok";m.textContent="Downloaded the request. Attach it in chatgpt.com and send, then copy ChatGPT's reply and tap Paste plan.";showPaste()}
}
function showPaste(){$("#pasteBox").hidden=false}
async function pastePlan(fromBox){
  const m=$("#planMsg"); let txt=fromBox?$("#tp_paste").value:"";
  if(!fromBox){try{txt=await navigator.clipboard.readText()}catch(e){}}
  if(!txt.trim()){$("#tp_paste").focus();m.className="msg err";m.textContent="Nothing to paste yet. Copy ChatGPT's reply first, or paste it into the box below.";return}
  let r; try{const a=txt.indexOf("{"),b=txt.lastIndexOf("}");r=JSON.parse(txt.slice(a,b+1))}catch(e){m.className="msg err";m.textContent="That doesn't look like ChatGPT's plan. Copy its whole reply and try again.";return}
  let meta={where:"",plans:""}; try{meta=JSON.parse(localStorage.getItem("wardrobe-pendingplan"))||meta}catch(e){}
  try{await applyPlan(r,meta);$("#tp_paste").value="";$("#pasteBox").hidden=true;try{localStorage.removeItem("wardrobe-pendingplan")}catch(e){}}
  catch(e){m.className="msg err";m.textContent=e.message}

async function applyPlan(r,{where,plans}){
    const m=$("#planMsg");
    const t={id:"trip-"+rid(),name:String(r.name||where).slice(0,80),where,plans,summary:String(r.summary||""),gaps:Array.isArray(r.gaps)?r.gaps.map(g=>typeof g==="string"?{item:g,why:""}:{item:String(g.item||""),why:String(g.why||"")}).filter(g=>g.item):[],createdAt:now()};
    const os=[];
    (Array.isArray(r.outfits)?r.outfits:[]).forEach((x,i)=>{
      const ids=[...new Set((x.itemIds||[]).map(String).filter(id=>itemById(id)))]; if(!ids.length) return;
      os.push({id:"outfit-"+rid(),name:[x.day,x.name].filter(Boolean).join(" · ")||`Day ${i+1}`,plan:[x.place,x.plan].filter(Boolean).join(": "),scene:String(x.scene||x.place||""),weather:String(x.weather||""),note:String(x.note||""),itemIds:ids,trip:t.name,tripId:t.id,renders:[],order:`${t.id}-${String(i).padStart(3,"0")}`,createdAt:now(),updatedAt:now()});
    });
    if(!os.length) throw new Error("The plan came back without usable outfits. Try again, or add more detail.");
    await putTrip(t); trips.push(t); for(const o of os){await putOutfit(o);outfits.push(o)}
    m.className="msg ok"; m.textContent=`Planned ${os.length} outfits.`; $("#tp_where").value="";$("#tp_plans").value="";$("#tp_style").value="";
    renderTrips(); openTrip(t.id);
}
function openTrip(id){
  const t=allTrips().find(x=>x.id===id); if(!t) return;
  openTripId=id; openId=null; openOutfitId=null;
  const os=tripOutfits(t), pack=[...new Set(os.flatMap(o=>o.itemIds))].map(itemById).filter(Boolean).sort((a,b)=>layerRank(a.category)-layerRank(b.category));
  openSheet(`${shead(t.name,t.where||"")}
    ${t.summary?`<p style="margin:0 0 12px">${esc(t.summary)}</p>`:""}
    <div class="panel"><h3>Packing list · ${pack.length} pieces</h3><div class="packing">${pack.map(it=>`<img src="${thumbOf(it)}" alt="${esc(it.name)}" title="${esc(it.name)}" data-titem="${esc(it.id)}">`).join("")}</div></div>
    ${t.gaps&&t.gaps.length?`<div class="panel"><h3>Worth adding</h3><ul class="gaps">${t.gaps.map(g=>`<li><b>${esc(g.item)}</b>${g.why?` — ${esc(g.why)}`:""}</li>`).join("")}</ul></div>`:""}

    <div class="row"><button class="danger small right" data-tdel>Delete this trip</button></div>`,{wide:true});
}
$("#sheet").addEventListener("click",async e=>{

  const ti=e.target.closest("[data-titem]"); if(ti){openTripId=null;openItem(ti.dataset.titem);return}

async function catAction(a,c){
  const msg=$("#catMsg"), taken=n=>catNames().some(x=>x.toLowerCase()===n.toLowerCase()||catLabel(x).toLowerCase()===n.toLowerCase());
  if(a==="addcat"){
    const name=($("#m_newcat").value||"").trim().replace(/\s+/g," ");
    if(!name){msg.className="msg err";msg.textContent="Type a name first.";return}
    if(taken(name)){msg.className="msg err";msg.textContent=`You already have ${name}.`;return}
    profile.cats.push({name,prefix:makePrefix(name)}); await putMeta(); refreshMore(); toast(`Added ${name}`); return;
  }
  if(a==="delcat"){
    if(items.some(it=>it.category===c)) return;
    profile.cats=profile.cats.filter(x=>x.name!==c); await putMeta(); if(activeCat===c)activeCat="All"; refreshMore(); toast(`Removed ${catLabel(c)}`); return;
  }
  if(a==="renamecat"){
    const name=(prompt(`Rename ${catLabel(c)} to:`,catLabel(c))||"").trim().replace(/\s+/g," ");
    if(!name||name===catLabel(c)) return;
    if(taken(name)){toast(`You already have ${name}.`);return}
    const ent=profile.cats.find(x=>x.name===c); if(ent) ent.name=name; else profile.cats.push({name,prefix:makePrefix(name)});
    await putMeta();

  }
}

function gptInstructions(sheets){
  const who=profile.name, person=profile.person||"person";
  return `WARDROBE STYLIST - instructions for this ChatGPT project

You are ${who}'s personal stylist. You plan outfits and trips from the clothes ${who} actually owns, and you make try-on pictures of ${who} wearing them.

FILES IN THIS PROJECT
- "2 - Catalog.csv": every piece ${who} owns, one row each: ID, category, description, color, brand, fabric, size, notes. This is the source of truth. Never invent pieces or IDs.
- "Closet sheet" images (${sheets}): a photo of every piece, each labeled with its ID. Use them to see exactly what a piece looks like.
- "Face photo" images: ${who}'s face, for try-on pictures.
- "3 - Trips and outfits.txt" (if present): trips and outfits already planned.

ABOUT ${who.toUpperCase()}
A ${person}.${profile.build?` Build: ${profile.build}.`:""}

PLANNING A TRIP
When ${who} describes a trip (places, dates, plans):
1. Give one outfit per day (or a day and an evening outfit if asked), covering every day, travel days included.
2. Use ONLY pieces from the catalog. Name each piece with its ID and short description, e.g. "OW-003 navy wool overcoat".
3. Make every outfit complete and right for the typical weather of that place and season: top layer(s), trousers, shoes, and outerwear when cold or wet.
4. Pack light: repeat shoes, outerwear and trousers across days where it looks good.
5. End with a packing list (IDs) and a short "worth buying" list: if an outfit needs a piece ${who} doesn't own or owns poorly, search the web and suggest one specific item with a link to a real retailer, and say why.

TRY-ON PICTURES

const dPut=(d,s,v,k)=>new Promise((res,rej)=>{const t=d.transaction(s,"readwrite");k===undefined?t.objectStore(s).put(v):t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("storage full"))});
const dDel=(d,s,k)=>new Promise((res,rej)=>{const t=d.transaction(s,"readwrite");t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)});
const dClear=(d,s)=>new Promise((res,rej)=>{const t=d.transaction(s,"readwrite");t.objectStore(s).clear();t.oncomplete=res;t.onerror=()=>rej(t.error)});
const STAMP={item:x=>x.updatedAt||x.createdAt||"",face:x=>x.updatedAt||x.addedAt||"",outfit:x=>x.updatedAt||x.createdAt||"",trip:x=>x.updatedAt||x.createdAt||"",log:x=>x.at||"",meta:x=>x.updatedAt||x.createdAt||""};
const STORE={item:"items",face:"faces",outfit:"outfits",trip:"trips",log:"log"};
const logKey=h=>h.at+"|"+h.itemId+"|"+h.source;
function toCloud(kind,x,uploads){
  const c={...x}; delete c._photoSources; const ref=u=>{if(typeof u!=="string"||!u.startsWith("data:"))return u;const h=photoHash(u),source=x._photoSources?.[h];if(typeof source==="string"&&/^sb:[a-f0-9]{32,64}$/.test(source))return source;uploads.set(h,u);return "sb:"+h};
  if(kind==="item"){c.photos=(x.photos||[]).map(ref);delete c.thumb}
  if(kind==="face") c.data=ref(x.data);
  if(kind==="outfit") c.renders=(x.renders||[]).map(r=>({...r,image:ref(r.image)}));
  if(kind==="log") delete c.seq;
  return c;
}
async function downloadPhoto(h){
  try{const res=await api(`/storage/v1/object/authenticated/photos/${session.uid}/${h}.jpg`,{raw:true});const b=await res.blob();
    const u=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(b)});
    await dPut(await syncDB(),"uploaded",1,h); return u}catch(e){return null}
}
async function fromCloud(kind,c,old){
  const cache=new Map(),sources={},add=u=>{if(typeof u==="string"&&u.startsWith("data:")){const h=photoHash(u);cache.set(h,u);const source=old?._photoSources?.[h];if(typeof source==="string"&&/^sb:[a-f0-9]{32,64}$/.test(source))cache.set(source.slice(3),u)}};
  if(old){(old.photos||[]).forEach(add);add(old.data);(old.renders||[]).forEach(r=>add(r.image))}
  const get=async u=>{if(typeof u!=="string"||!u.startsWith("sb:"))return u;const h=u.slice(3),image=cache.get(h)||await downloadPhoto(h);if(!image)throw new Error("A photo could not be downloaded. Your existing record is unchanged; try Sync now again.");sources[photoHash(image)]=u;return image};
  const x={...c};
  if(kind==="item"){x.photos=await Promise.all((c.photos||[]).map(get));x.thumb=x.photos[0]?(old&&old.photos&&old.photos[0]===x.photos[0]&&old.thumb?old.thumb:await shrink(x.photos[0],380,"image/jpeg",.8)):""}
  if(kind==="face") x.data=await get(c.data);
  if(kind==="outfit") x.renders=await Promise.all((c.renders||[]).map(async r=>({...r,image:await get(r.image)})));
  if(Object.keys(sources).length)x._photoSources=sources;
  return x;
}
async function uploadPhotos(uploads,status){
  const sd=await syncDB(), todo=[];
  for(const [h,u] of uploads) if(!(await dGet(sd,"uploaded",h))) todo.push([h,u]);
  const total=todo.length; let done=0;
  const worker=async()=>{while(todo.length){const [h,u]=todo.shift();const blob=await dataURLtoBlob(u);
    await api(`/storage/v1/object/photos/${session.uid}/${h}.jpg`,{method:"POST",body:blob,headers:{"Content-Type":blob.type||"image/jpeg","x-upsert":"true"}});
    await dPut(sd,"uploaded",1,h); done++; status(`Uploading photos… ${done} of ${total}`)}};
  await Promise.all([worker(),worker(),worker()]);
}
async function pushRows(rows){
  for(let i=0;i<rows.length;i+=150) await api("/rest/v1/records?on_conflict=user_id,wardrobe,kind,id",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows.slice(i,i+150))});
}
async function pushWardrobe(d,cloudId,status){
  // remember the version of each record already sent, so nothing is missed however long a save takes
  const st=await syncState0(d), rows=[], uploads=new Map(), sent=[];
  const prof=await dGet(d,"meta","profile");
  if(prof&&st.pushed["meta:profile"]!==STAMP.meta(prof)){const {cloudId:_c,...p}=prof;rows.push({kind:"meta",id:"profile",data:p,deleted:false});sent.push(["meta:profile",STAMP.meta(prof)])}
  for(const [kind,store] of Object.entries(STORE))
    for(const x of await getAll(store,d)){const id=kind==="log"?logKey(x):String(x.id), k=kind+":"+id, v=STAMP[kind](x)||"-";
      if(st.pushed[k]===v) continue; rows.push({kind,id,data:toCloud(kind,x,uploads),deleted:false}); sent.push([k,v])}
  const tombs=(await getAll("meta",d)).filter(m=>String(m.id).startsWith("del:"));
  for(const t of tombs) rows.push({kind:t.kind,id:t.key,data:{at:t.at},deleted:true});
  if(rows.length){
    await uploadPhotos(uploads,status);
    status(`Saving ${rows.length} change${rows.length===1?"":"s"}…`);
    await pushRows(rows.map(r=>({user_id:session.uid,wardrobe:cloudId,...r})));
    for(const t of tombs){await dDel(d,"meta",t.id);delete st.pushed[t.kind+":"+t.key]}
    const cur=await syncState0(d); for(const [k,v] of sent) cur.pushed[k]=v; for(const t of tombs) delete cur.pushed[t.kind+":"+t.key]; await dPut(d,"meta",cur);
  }
  return rows.length;
}
async function applyRows(rows,localByCloud,status){
  const changed=new Set(), added=[], removed=[]; const groups=new Map();
  for(const r of rows){if(!groups.has(r.wardrobe))groups.set(r.wardrobe,[]);groups.get(r.wardrobe).push(r)}
  for(const [w,list] of groups){
    list.sort((a,b)=>(a.kind==="meta"?0:1)-(b.kind==="meta"?0:1));
    let name=localByCloud.get(w); const metaRow=list.find(r=>r.kind==="meta");
    if(metaRow&&metaRow.deleted){ // deleted on another device
      if(name){removed.push(name);localByCloud.delete(w)} continue;
    }
    if(!name){
      if(!metaRow) continue;
      name="wardrobe-p-"+rid(); const nd=await openDB(name);
      await dPut(nd,"meta",{...metaRow.data,id:"profile",cloudId:w}); await dPut(nd,"meta",{id:"sync",pushed:{}}); nd.close();
      rememberDB(name); localByCloud.set(w,name); added.push(metaRow.data.name||"A wardrobe");
    }
    const d=name===dbName?db:await openDB(name); let n=0; const logs=new Set((await getAll("log",d)).map(logKey)); const seen=[];
    for(const r of list){
      if(r.kind==="meta"){const loc=await dGet(d,"meta","profile");if(!loc||STAMP.meta(r.data)>STAMP.meta(loc)){await dPut(d,"meta",{...r.data,id:"profile",cloudId:w});n++}if(!loc||STAMP.meta(r.data)>=STAMP.meta(loc))seen.push(["meta:profile",STAMP.meta(r.data)]);continue}
      const store=STORE[r.kind]; if(!store) continue;
      if(r.kind==="log"){if(!r.deleted&&!logs.has(r.id)){const {seq,...x}=r.data;await dPut(d,"log",x);logs.add(r.id);n++}if(!r.deleted)seen.push(["log:"+r.id,STAMP.log(r.data)||"-"]);continue}
      const loc=await dGet(d,store,r.id);
      if(r.deleted){if(loc&&STAMP[r.kind](loc)<=(r.data.at||r.data.updatedAt||r.updated_at)){await dDel(d,store,r.id);n++}continue}
      const t=await dGet(d,"meta","del:"+r.kind+":"+r.id); if(t&&t.at>STAMP[r.kind](r.data)) continue;
      if(!loc||STAMP[r.kind](r.data)>STAMP[r.kind](loc)){status(`Bringing in changes… ${++n}`);await dPut(d,store,await fromCloud(r.kind,r.data,loc))}
      if(!loc||STAMP[r.kind](r.data)>=STAMP[r.kind](loc)) seen.push([r.kind+":"+r.id,STAMP[r.kind](r.data)||"-"]);
    }
    if(seen.length){const st=await syncState0(d);for(const [k,v] of seen)st.pushed[k]=v;await dPut(d,"meta",st)}
    if(n) changed.add(name);
    if(d!==db) d.close();
  }
  return {changed,added,removed};
}
async function syncState0(d){const st=(await dGet(d,"meta","sync"))||{id:"sync"};st.pushed=st.pushed||{};return st}
let syncing=false, syncAgain=false, syncTimer=null, syncState={text:"",err:false};
function scheduleSync(delay=4000){if(!session||!cloudReady())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),delay)}
function setSync(text,err){syncState={text,err:!!err};renderSyncFlag();const el=$("#syncStatus");if(el){el.className="msg"+(err?" err":"");el.textContent=text}}
function renderSyncFlag(){
  const f=$("#syncFlag"); if(!f) return; f.hidden=!(session&&cloudReady()&&syncState.err&&!syncing);
  f.textContent="Not synced";
  const av=$("#avatar"); if(av) av.classList.toggle("syncing",!!(session&&syncing));
  if(tab==="more"&&!openPanelKey){const r=$('[data-panel="sync"] .ls');if(r)r.textContent=!cloudReady()?"Not set up":!session?"Signed out":syncState.err?"Needs attention":"On"}
}
async function syncNow(){
  if(!session||!cloudReady()) return;
  if(syncing){syncAgain=true;return}
  syncing=true; clearTimeout(syncTimer); setSync("Syncing…");
  try{
    const metas=await api("/rest/v1/records?select=wardrobe,data,deleted&kind=eq.meta")||[];
    const localByCloud=new Map(), unlinked=[];
    for(const n of await knownDBs()){
      const d=n===dbName?db:await openDB(n); const p=await dGet(d,"meta","profile"); if(d!==db) d.close();
      if(!p) continue; if(p.cloudId&&!localByCloud.has(p.cloudId)) localByCloud.set(p.cloudId,n); else unlinked.push([n,p]);
    }
    for(const [n,p] of unlinked){ // first sync of a wardrobe: join one with the same name, or start a new one
      const m=metas.find(x=>!x.deleted&&x.data&&String(x.data.name||"").toLowerCase()===String(p.name).toLowerCase()&&!localByCloud.has(x.wardrobe));
      p.cloudId=m?m.wardrobe:"w-"+rid(); const d=n===dbName?db:await openDB(n);
      await dPut(d,"meta",p); await dPut(d,"meta",{id:"sync",pushed:{}}); if(d!==db) d.close();
      if(n===dbName) profile=p; localByCloud.set(p.cloudId,n);
    }
    for(const [cid,n] of localByCloud){const d=n===dbName?db:await openDB(n);await pushWardrobe(d,cid,setSync);if(d!==db)d.close()}
    const sd=await syncDB(), ck="cursor:"+session.uid, since=(await dGet(sd,"state",ck))||"1970-01-01T00:00:00Z"; const rows=[];
    for(let off=0;;off+=1000){const page=await api(`/rest/v1/records?select=wardrobe,kind,id,data,deleted,updated_at&kind=neq.reference&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=1000&offset=${off}`)||[];rows.push(...page);if(page.length<1000)break}
    const res=await applyRows(rows,localByCloud,setSync);
    if(rows.length){const max=rows.map(r=>r.updated_at).sort().pop();await dPut(sd,"state",new Date(new Date(max).getTime()-120000).toISOString(),ck)}
    for(const n of res.removed){
      if(n===dbName){db.close();db=null}
      await new Promise(r=>{const q=indexedDB.deleteDatabase(n);q.onsuccess=q.onerror=q.onblocked=()=>r()}); forgetDB(n);
    }
    if(!db){const rest=await knownDBs(); syncing=false; if(rest.length){await switchTo(rest[0]);toast("That wardrobe was deleted on another device")} else showWelcome({first:true}); return}
    if(res.changed.has(dbName)){await loadAll();profile=await dGet(db,"meta","profile");if(!$("#modal").classList.contains("open"))renderAll();else renderHeader()}
    if(res.added.length) toast(`Added from your other device: ${res.added.join(", ")}`);
    LS.set("wardrobe-lastsync",now()); syncing=false; setSync("Synced just now");
    if(res.added.length) refreshMore();
  }catch(e){syncing=false;setSync(e.message==="offline"?"Offline. It will sync when you're back online.":"Sync problem: "+e.message,true)}
  syncing=false; renderSyncFlag();
  if(syncAgain){syncAgain=false;scheduleSync(1000)}
}
async function cloudDeleteWardrobe(cid){
  await api(`/rest/v1/records?wardrobe=eq.${encodeURIComponent(cid)}&kind=neq.meta`,{method:"DELETE"});
  await pushRows([{user_id:session.uid,wardrobe:cid,kind:"meta",id:"profile",data:{at:now()},deleted:true}]);
}

async function syncAction(a){
  const st=$("#syncStatus"), say=(t,err)=>{if(st){st.className="msg"+(err?" err":" ok");st.textContent=t}};
  if(a==="resetpassword")return openResetRequest($("#c_email")?.value?.trim()||session?.email||"");
  if(a==="savecloud"){LS.set("wardrobe-cloud",{url:$("#c_url").value.trim(),anon:$("#c_anon").value.trim()});$("#syncPanel").innerHTML=syncPanelHTML();renderSyncFlag();return}
  if(a==="signin"||a==="signup"){
    const email=$("#c_email").value.trim(), pw=$("#c_pw").value;
    if(!email||!pw) return say("Enter your email and a password.",true);
    if(a==="signup"&&pw.length<8) return say("Use a password of at least 8 characters.",true);
    say("One moment…");
    try{
      if(a==="signup"){const j=await authCall("signup",{email,password:pw});if(!j.access_token)return say("Account created. Open the email we just sent, tap the link to confirm, then come back and tap Sign in.");keepSession(j)}
      else keepSession(await authCall("token?grant_type=password",{email,password:pw}));
      const sd=await syncDB(); await dClear(sd,"uploaded");
      $("#syncPanel").innerHTML=syncPanelHTML(); await syncNow();
    }catch(e){say(e.message,true)}
    return;
  }
  if(a==="syncnow") return syncNow();
  if(a==="signout"){if(!confirm("Sign out of sync on this device? Your clothes stay on this device."))return;session=null;LS.set("wardrobe-session",null);syncState={text:"",err:false};$("#syncPanel").innerHTML=syncPanelHTML();renderSyncFlag()}
}

function tripGroups(){ // trips the planner made, plus imported outfit groups that carry a trip name
  const m=new Map();
  for(const t of trips) m.set(t.name,{name:t.name,where:t.where||"",id:t.id,at:t.createdAt||0});
  for(const o of outfits) if(o.trip&&!m.has(o.trip)) m.set(o.trip,{name:o.trip,where:"",id:null,at:o.createdAt||0});
  return [...m.values()].sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
function renderHome(){
  $("#brandName").textContent=`${profile.name}'s wardrobe`;
  const tg=tripGroups(), plural=(n,w)=>n?`${n} ${w}${n===1?"":"s"}`:"";

  renderStart();
}

$("#whoBtn").onclick=()=>showTab("more");
$("#syncFlag").onclick=()=>{showTab("more");openPanel("sync")};
$("#chips").onclick=e=>{if(e.target.closest("[data-addcat]")){openPanel("cats");return}const c=e.target.closest("[data-cat]");if(c){activeCat=c.dataset.cat;render()}};
$("#cats").onclick=async e=>{
  const bd=e.target.closest("[data-bulkdel]");
  if(bd){
    const cat=bd.dataset.bulkdel, list=items.filter(it=>it.category===cat);
    if(!confirm(`Delete all ${list.length} ${catLabel(cat)}, with their photos and history? This can't be undone.`)) return;
    for(const it of list){await delItem(it.id);await tomb("item",it.id);await logEntry({at:now(),itemId:it.id,itemLabel:label(it),source:"delete",text:"",changes:[]})}
    items=items.filter(it=>it.category!==cat); toast(`Deleted ${list.length} ${catLabel(cat)}`); render(); return;
  }
  const c=e.target.closest(".card"); if(c) openItem(c.dataset.id);
};
$("#q").oninput=e=>{query=e.target.value.trim();render()};
function openFixSheet(){
  openSheet(`${shead("Fix something")}<p class="muted sm" style="margin-top:0">Say what's wrong in your own words. You'll see the change before it's saved, and you can undo it later.</p>
    <div class="askrow"><textarea id="fixText" rows="2" placeholder="The grey Zegna coat is actually black"></textarea><button class="send" id="fixBtn" aria-label="Check"><svg viewBox="0 0 24 24" class="ic"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <div id="fixOut" class="preview"></div>`);
  $("#fixBtn").onclick=()=>runFix($("#fixText").value,$("#fixOut"));
  $("#fixText").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#fixBtn").click()}};
  setTimeout(()=>$("#fixText").focus(),50);
}
$("#openFix").onclick=openFixSheet;
const autoGrow=el=>{el.style.height="auto";el.style.height=Math.min(el.scrollHeight+2,140)+"px"};
document.addEventListener("input",e=>{if(e.target.id==="fixText"||e.target.id==="itemFix")autoGrow(e.target)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal").classList.contains("open")) closeModal();
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="itemFix"){e.preventDefault();runFix(e.target.value,$("#itemFixOut"),items.find(x=>x.id===openId))}
});
$("#brandBtn").onclick=()=>{showTab("more");openPanel("wardrobes")};
$("#addPhotos").onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length)addFromPhotos(f)};
$("#addManualBtn").onclick=openAddManual;

$("#pastePlanBtn").onclick=()=>pastePlan(false);
$("#usePasteBtn").onclick=()=>pastePlan(true);
try{if(localStorage.getItem("wardrobe-pendingplan"))showPaste()}catch(e){}

$("#planBtn").onclick=planTrip;
$("#tripList").onclick=e=>{const c=e.target.closest("[data-trip]");if(c)openTrip(c.dataset.trip)};
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
<script src="workflow.js"></script>
<script src="auth-recovery.js"></script>
<script>
bootWardrobe().catch(err=>{
  document.querySelector("main").innerHTML=`<div class="panel msg err">This browser blocked storage, so the app can't save anything (${esc(err.message)}). Open it in Safari or Chrome, outside a private window.</div>`;
});
</script>
</body>
</html>
